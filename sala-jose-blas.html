<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050505;
  color: #ffffff;
  font-family: Georgia, "Times New Roman", serif;
}

.museo {
  position: relative;
  width: 100%;
  height: 100vh;
  background: #050505;
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 1.2s ease;
  background: #050505;
}

.slide.active {
  opacity: 1;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.slide::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.15),
      rgba(0,0,0,0.30) 45%,
      rgba(0,0,0,0.82)
    );
}

.texto {
  position: absolute;
  z-index: 5;
  left: 50%;
  bottom: 13%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 1000px;
  text-align: center;
  text-shadow:
    0 2px 5px #000,
    0 3px 12px #000;
}

.texto h1 {
  margin: 0 0 14px;
  color: #d4af37;
  font-size: clamp(28px, 4vw, 58px);
  letter-spacing: 3px;
  text-transform: uppercase;
}

.texto p {
  margin: 0;
  font-size: clamp(18px, 2vw, 28px);
  line-height: 1.5;
}

.flecha {
  position: absolute;
  z-index: 10;
  top: 50%;
  transform: translateY(-50%);
  width: 52px;
  height: 70px;
  border: none;
  background: rgba(0,0,0,0.35);
  color: #d4af37;
  font-size: 48px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.flecha:hover {
  background: rgba(212,175,55,0.25);
  color: #ffffff;
}

.izquierda {
  left: 15px;
}

.derecha {
  right: 15px;
}

.puntos {
  position: absolute;
  z-index: 20;
  bottom: 75px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
}

.punto {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: rgba(255,255,255,0.45);
  border: 1px solid rgba(212,175,55,0.8);
  cursor: pointer;
}

.punto.active {
  background: #d4af37;
}

.titulo-superior {
  position: absolute;
  z-index: 20;
  top: 25px;
  left: 50%;
  transform: translateX(-50%);
  color: #d4af37;
  font-size: clamp(18px, 2vw, 28px);
  letter-spacing: 4px;
  text-transform: uppercase;
  text-shadow: 0 2px 8px #000;
  white-space: nowrap;
}

#musicButton {
  position: absolute;
  z-index: 30;
  right: 25px;
  bottom: 25px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid #d4af37;
  background: rgba(0,0,0,0.65);
  color: #d4af37;
  font-size: 20px;
  cursor: pointer;
}

#musicButton:hover {
  background: rgba(212,175,55,0.25);
}

.volver {
  position: absolute;
  z-index: 25;
  left: 25px;
  bottom: 25px;
  color: #d4af37;
  text-decoration: none;
  font-size: 17px;
  letter-spacing: 1px;
  text-shadow: 0 2px 5px #000;
  transition: color 0.3s ease;
}

.volver:hover {
  color: #ffffff;
}

.youtube-oculto {
  position: absolute;
  width: 1px;
  height: 1px;
  left: -10000px;
  top: -10000px;
  opacity: 0;
  pointer-events: none;
}

@media (max-width: 700px) {

  .texto {
    bottom: 16%;
    width: 92%;
  }

  .texto h1 {
    letter-spacing: 1px;
  }

  .texto p {
    font-size: 18px;
  }

  .flecha {
    width: 40px;
    font-size: 35px;
  }

  .titulo-superior {
    top: 18px;
    font-size: 16px;
    letter-spacing: 2px;
  }

}

</style>

</head>

<script>

/* ==========================================
   FRAGMENTOS DEL PREGÓN DE JOSÉ BLAS

   VÍDEO: 2C58SaN-esg
   ========================================== */

const fragmentos = [

  {
    titulo: "BORRIQUITA",
    start: 3527,
    end: 3658
  },

  {
    titulo: "FÁTIMA",
    start: 4360,
    end: 4500
  },

  {
    titulo: "MAYOR DOLOR",
    start: 7907,
    end: 8016
  },

  {
    titulo: "TRASPASO",
    start: 8600,
    end: 8674
  },

  {
    titulo: "EL CRISTO",
    start: 9420,
    end: 9493
  },

  {
    titulo: "AMARGURA",
    start: 10317,
    end: 10623
  }

];


let indice = 0;
let temporizador = null;

let pregonPlayer = null;
let musicPlayer = null;

let musicPlaying = false;


/* ==========================================
   CREAR LOS REPRODUCTORES
   ========================================== */

function onYouTubeIframeAPIReady() {

  pregonPlayer = new YT.Player("pregonPlayer", {

    height: "1",
    width: "1",

    videoId: "2C58SaN-esg",

    playerVars: {
      autoplay: 0,
      controls: 0,
      rel: 0,
      playsinline: 1
    },

    events: {

      onReady: function() {

        iniciarFragmento(0);

      }

    }

  });


  musicPlayer = new YT.Player("musicPlayer", {

    height: "1",
    width: "1",

    videoId: "JbE0dBSUGkk",

    playerVars: {
      autoplay: 0,
      controls: 0,
      loop: 1,
      playlist: "JbE0dBSUGkk",
      rel: 0,
      playsinline: 1
    },

    events: {

      onReady: function(event) {

        event.target.setVolume(8);

      }

    }

  });

}


/* ==========================================
   INICIAR FRAGMENTO
   ========================================== */

function iniciarFragmento(numero) {

  clearTimeout(temporizador);

  indice = numero;

  mostrarSlide(indice);

  const fragmento = fragmentos[indice];

  if (pregonPlayer) {

    pregonPlayer.loadVideoById({

      videoId: "2C58SaN-esg",

      startSeconds: fragmento.start

    });

  }

  const duracion =
    (fragmento.end - fragmento.start) * 1000;

  temporizador = setTimeout(function() {

    if (indice < fragmentos.length - 1) {

      iniciarFragmento(indice + 1);

    } else {

      iniciarFragmento(0);

    }

  }, duracion);

}


/* ==========================================
   MOSTRAR SLIDE
   ========================================== */

function mostrarSlide(numero) {

  const slides =
    document.querySelectorAll(".slide");

  const puntos =
    document.querySelectorAll(".punto");

  slides.forEach(function(slide, i) {

    slide.classList.toggle(
      "active",
      i === numero
    );

  });

  puntos.forEach(function(punto, i) {

    punto.classList.toggle(
      "active",
      i === numero
    );

  });

}


/* ==========================================
   SIGUIENTE
   ========================================== */

function siguiente() {

  let nuevo = indice + 1;

  if (nuevo >= fragmentos.length) {
    nuevo = 0;
  }

  iniciarFragmento(nuevo);

}


/* ==========================================
   ANTERIOR
   ========================================== */

function anterior() {

  let nuevo = indice - 1;

  if (nuevo < 0) {
    nuevo = fragmentos.length - 1;
  }

  iniciarFragmento(nuevo);

}


/* ==========================================
   IR A FRAGMENTO
   ========================================== */

function irA(numero) {

  iniciarFragmento(numero);

}


/* ==========================================
   MÚSICA
   ========================================== */

function toggleMusic() {

  if (!musicPlayer) {
    return;
  }

  if (!musicPlaying) {

    musicPlayer.playVideo();

    musicPlaying = true;

    document.getElementById("musicButton").innerHTML = "❚❚";

  } else {

    musicPlayer.pauseVideo();

    musicPlaying = false;

    document.getElementById("musicButton").innerHTML = "♪";

  }

}

</script>
