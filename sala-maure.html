

<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sala I · Maure</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: #f5f0df;
  font-family: Georgia, "Times New Roman", serif;
}

header {
  text-align: center;
  padding: 35px 20px 20px;
}

.entrada {
  color: #c9a44a;
  text-decoration: none;
  font-size: 14px;
  letter-spacing: 1px;
}

h1 {
  margin: 15px 0 5px;
  color: #d4af57;
  font-size: 38px;
  font-weight: normal;
}

.subtitulo {
  color: #bdb7a6;
  font-size: 16px;
}

.museo {
  max-width: 1200px;
  margin: auto;
  padding: 10px 20px 50px;
}

.marco {
  position: relative;
  background: #111;
  border: 1px solid #4e4023;
  box-shadow: 0 0 30px rgba(0,0,0,.8);
  overflow: hidden;
}

.imagen-contenedor {
  width: 100%;
  height: 65vh;
  min-height: 430px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050505;
}

#imagenSala {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.flecha {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 52px;
  height: 70px;
  border: 1px solid rgba(212,175,87,.5);
  background: rgba(0,0,0,.65);
  color: #d4af57;
  font-size: 42px;
  cursor: pointer;
  z-index: 10;
}

.flecha:hover {
  background: rgba(212,175,87,.2);
}

.izquierda {
  left: 15px;
}

.derecha {
  right: 15px;
}

.informacion {
  text-align: center;
  padding: 25px 20px 30px;
}

.numero {
  color: #a58a4a;
  font-size: 13px;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.hermandad {
  color: #d4af57;
  font-size: 27px;
  margin-bottom: 8px;
}

.tipo {
  color: #c7c1b2;
  font-size: 15px;
}

.tiempo {
  margin-top: 10px;
  color: #928b7b;
  font-size: 14px;
}

.boton-fragmento {
  margin-top: 20px;
  padding: 13px 28px;
  background: transparent;
  border: 1px solid #b89443;
  color: #d4af57;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 15px;
  cursor: pointer;
}

.boton-fragmento:hover {
  background: rgba(212,175,87,.12);
}

.puntos {
  text-align: center;
  padding: 18px 0 5px;
}

.punto {
  display: inline-block;
  width: 9px;
  height: 9px;
  margin: 0 5px;
  border-radius: 50%;
  border: 1px solid #8c7239;
  cursor: pointer;
}

.punto.activo {
  background: #d4af57;
}

.musica {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 50;
}

#botonMusica {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid #b89443;
  background: rgba(10,10,10,.9);
  color: #d4af57;
  cursor: pointer;
  font-size: 18px;
}

#pregonPlayer,
#musicaPlayer {
  position: fixed;
  width: 300px;
  height: 170px;
  right: -500px;
  bottom: 0;
  opacity: 0;
  pointer-events: none;
}

footer {
  text-align: center;
  padding: 20px;
  color: #716b5e;
  font-size: 13px;
}

</style>
</head>

<body>

<header>

<a class="entrada" href="index.html">← Volver al Museo de los Pregoneros</a>

<h1>SALA I · MAURE</h1>

<div class="subtitulo">
Las voces de un pregón
</div>

</header>


<main class="museo">

<div class="marco">

  <div class="imagen-contenedor">
    <img id="imagenSala" src="" alt="Hermandad">
  </div>

  <button class="flecha izquierda" onclick="anterior()">‹</button>
  <button class="flecha derecha" onclick="siguiente()">›</button>

  <div class="informacion">

    <div class="numero" id="numeroFragmento">
      FRAGMENTO I
    </div>

    <div class="hermandad" id="nombreHermandad">
      Tres Caídas
    </div>

    <div class="tipo">
      Maure · Pregón
    </div>

    <div class="tiempo" id="tiempoFragmento">
      00:40 — 00:43
    </div>

    <button class="boton-fragmento" onclick="escucharFragmento()">
      ▶ Escuchar fragmento
    </button>

  </div>

</div>


<div class="puntos" id="puntos"></div>

</main>


<div class="musica">

<button id="botonMusica" onclick="activarMusica()">
  ♪
</button>

</div>


<!-- REPRODUCTOR DEL PREGÓN -->

<div id="pregonPlayer"></div>


<!-- REPRODUCTOR DE LA MARCHA -->

<div id="musicaPlayer"></div>


<footer>
Museo de los Pregoneros · Sala I
</footer>


<script>

const VIDEO_PREGON = "Q2vFuXOILCM";

const VIDEO_MARCHA = "JbE0dBSUGkk";


const fragmentos = [

{
  nombre: "Tres Caídas",
  imagen: "https://static.grupojoly.com/clip/aadb22a6-ba2a-40fa-ad4b-e25e8239de8e_source-aspect-ratio_1600w_0.webp",
  inicio: 40,
  fin: 43,
  tiempo: "00:40 — 00:43"
},

{
  nombre: "Judíos de San Mateo",
  imagen: "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Judios-San-Mateo_Jerez2016_P1010706.JPG/960px-Judios-San-Mateo_Jerez2016_P1010706.JPG?utm_source=es.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail",
  inicio: 64,
  fin: 67.5,
  tiempo: "01:04 — 01:07:30"
},

{
  nombre: "Angustias",
  imagen: "https://www.uniondehermandades.com/wp-content/uploads/2018/10/ANGUSTIAS2.jpg",
  inicio: 77,
  fin: 81.633,
  tiempo: "01:17 — 01:21:38"
},

{
  nombre: "Tres Caídas",
  imagen: "https://static.grupojoly.com/clip/94c6ed92-5ded-42a4-9dcb-464df155a1ed_16-9-aspect-ratio_1600w_0.webp",
  inicio: 89,
  fin: 92.3,
  tiempo: "01:29 — 01:32:18"
},

{
  nombre: "Virgen de la Esperanza de la Yedra",
  imagen: "https://static.grupojoly.com/clip/a4d8d001-471c-48f3-a666-99b932cccb9c_16-9-aspect-ratio_1600w_0.webp",
  inicio: 102,
  fin: 107.8,
  tiempo: "01:42 — 01:47:48"
},

{
  nombre: "Virgen de los Dolores",
  imagen: "https://www.mundocofrade.es/asset/thumbnail,992,744,center,center/media/mundocofrade/images/2026/06/19/2026061909223555444.jpg",
  inicio: 8534,
  fin: 8818,
  tiempo: "02:22:14 — 02:26:58"
}

];


let indiceActual = 0;

let pregonPlayer = null;

let musicaPlayer = null;

let temporizador = null;

let musicaActiva = false;

let reproduciendo = false;


/* =========================
   MOSTRAR FRAGMENTO
========================= */

function mostrarFragmento(indice) {

  indiceActual = indice;

  const fragmento = fragmentos[indice];

  document.getElementById("imagenSala").src = fragmento.imagen;

  document.getElementById("numeroFragmento").textContent =
    "FRAGMENTO " + numeroRomano(indice + 1);

  document.getElementById("nombreHermandad").textContent =
    fragmento.nombre;

  document.getElementById("tiempoFragmento").textContent =
    fragmento.tiempo;

  crearPuntos();

}


/* =========================
   NÚMEROS ROMANOS
========================= */

function numeroRomano(numero) {

  const romanos = [
    "I",
    "II",
    "III",
    "IV",
    "V",
    "VI"
  ];

  return romanos[numero - 1];

}


/* =========================
   PUNTOS
========================= */

function crearPuntos() {

  const contenedor = document.getElementById("puntos");

  contenedor.innerHTML = "";

  fragmentos.forEach(function(fragmento, i) {

    const punto = document.createElement("span");

    punto.className = "punto";

    if (i === indiceActual) {
      punto.classList.add("activo");
    }

    punto.onclick = function() {

      detenerPregon();

      mostrarFragmento(i);

    };

    contenedor.appendChild(punto);

  });

}


/* =========================
   SIGUIENTE
========================= */

function siguiente() {

  detenerPregon();

  let nuevoIndice = indiceActual + 1;

  if (nuevoIndice >= fragmentos.length) {
    nuevoIndice = 0;
  }

  mostrarFragmento(nuevoIndice);

}


/* =========================
   ANTERIOR
========================= */

function anterior() {

  detenerPregon();

  let nuevoIndice = indiceActual - 1;

  if (nuevoIndice < 0) {
    nuevoIndice = fragmentos.length - 1;
  }

  mostrarFragmento(nuevoIndice);

}


/* =========================
   ESCUCHAR FRAGMENTO
========================= */

function escucharFragmento() {

  if (!pregonPlayer) {

    alert("El reproductor todavía está cargando. Espera unos segundos y vuelve a pulsar.");

    return;

  }

  const fragmento = fragmentos[indiceActual];


  detenerPregon();


  pregonPlayer.loadVideoById({

    videoId: VIDEO_PREGON,

    startSeconds: fragmento.inicio

  });


  pregonPlayer.setVolume(100);

  pregonPlayer.playVideo();


  iniciarMusica();


  reproduciendo = true;


  temporizador = setInterval(function() {

    if (!pregonPlayer) {
      return;
    }

    const posicion = pregonPlayer.getCurrentTime();


    if (posicion >= fragmento.fin) {

      detenerPregon();


      setTimeout(function() {

        siguiente();

      }, 700);

    }

  }, 200);

}


/* =========================
   DETENER PREGÓN
========================= */

function detenerPregon() {

  if (temporizador) {

    clearInterval(temporizador);

    temporizador = null;

  }


  if (pregonPlayer) {

    try {

      pregonPlayer.stopVideo();

    } catch (e) {}

  }

  reproduciendo = false;

}


/* =========================
   MÚSICA
========================= */

function iniciarMusica() {

  if (!musicaPlayer) {
    return;
  }

  musicaPlayer.setVolume(10);

  musicaPlayer.playVideo();

  musicaActiva = true;

}


function activarMusica() {

  if (!musicaPlayer) {

    return;

  }


  if (musicaActiva) {

    musicaPlayer.pauseVideo();

    musicaActiva = false;

    document.getElementById("botonMusica").textContent = "♪";

  } else {

    musicaPlayer.setVolume(10);

    musicaPlayer.playVideo();

    musicaActiva = true;

    document.getElementById("botonMusica").textContent = "Ⅱ";

  }

}


/* =========================
   YOUTUBE
========================= */

function onYouTubeIframeAPIReady() {


  pregonPlayer = new YT.Player("pregonPlayer", {

    width: "300",

    height: "170",

    videoId: VIDEO_PREGON,

    playerVars: {

      controls: 0,

      rel: 0,

      modestbranding: 1,

      playsinline: 1

    },

    events: {

      onReady: function(event) {

        event.target.setVolume(100);

      }

    }

  });


  musicaPlayer = new YT.Player("musicaPlayer", {

    width: "300",

    height: "170",

    videoId: VIDEO_MARCHA,

    playerVars: {

      controls: 0,

      rel: 0,

      modestbranding: 1,

      playsinline: 1

    },

    events: {

      onReady: function(event) {

        event.target.setVolume(10);

      }

    }

  });

}


/* =========================
   INICIO
========================= */

mostrarFragmento(0);

</script>


<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
