}


/*
   LOS DOS REPRODUCTORES QUEDAN
   COMPLETAMENTE FUERA DE LA PANTALLA.
*/

#pregonPlayer,
#musicaPlayer {
  position: fixed;
  width: 2px;

  left: -1000px;

<body>


<header>

<a class="entrada" href="index.html">
← Volver al Museo de los Pregoneros
</a>

<h1>SALA I · MAURE</h1>

<div class="subtitulo">
Las voces de un pregón
</div>

</header>


<main class="museo">


<div class="marco">


<div class="imagen-contenedor">

<img id="imagenSala" src="" alt="Hermandad">

</div>


<button class="flecha izquierda" onclick="anterior()">
‹
</button>


<button class="flecha derecha" onclick="siguiente()">
›
</button>


<div class="informacion">

<div class="numero" id="numeroFragmento">
FRAGMENTO I
</div>

<div class="hermandad" id="nombreHermandad">
Tres Caídas
</div>

<div class="tipo">
Maure · Pregón
</div>

<div class="tiempo" id="tiempoFragmento">
00:40 — 00:43
</div>


<button
class="boton-fragmento"
id="botonFragmento"
onclick="escucharFragmento()">

▶ Escuchar fragmento

</button>

</div>

</div>

</main>


<div class="musica">

<button
id="botonMusica"
onclick="activarMusica()">

♪

</button>

</div>


<!-- PREGÓN -->

<div id="pregonPlayer"></div>


<!-- MARCHA -->

<div id="musicaPlayer"></div>


<footer>

Museo de los Pregoneros · Sala I

</footer>



<script>


const VIDEO_PREGON = "Q2vFuXOILCM";

const VIDEO_MARCHA = "JbE0dBSUGkk";


const fragmentos = [

{
nombre: "Tres Caídas",
imagen: "https://static.grupojoly.com/clip/aadb22a6-ba2a-40fa-ad4b-e25e8239de8e_source-aspect-ratio_1600w_0.webp",
inicio: 40,
fin: 43,
tiempo: "00:40 — 00:43"
},

{
nombre: "Judíos de San Mateo",
imagen: "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Judios-San-Mateo_Jerez2016_P1010706.JPG/960px-Judios-San-Mateo_Jerez2016_P1010706.JPG?utm_source=es.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail",
inicio: 64,
fin: 67.5,
tiempo: "01:04 — 01:07:30"
},

{
nombre: "Angustias",
imagen: "https://www.uniondehermandades.com/wp-content/uploads/2018/10/ANGUSTIAS2.jpg",
inicio: 77,
fin: 81.633,
tiempo: "01:17 — 01:21:38"
},

{
nombre: "Tres Caídas",
imagen: "https://static.grupojoly.com/clip/94c6ed92-5ded-42a4-9dcb-464df155a1ed_16-9-aspect-ratio_1600w_0.webp",
inicio: 89,
fin: 92.3,
tiempo: "01:29 — 01:32:18"
},

{
nombre: "Virgen de la Esperanza de la Yedra",
imagen: "https://static.grupojoly.com/clip/a4d8d001-471c-48f3-a666-99b932cccb9c_16-9-aspect-ratio_1600w_0.webp",
inicio: 102,
fin: 107.8,
tiempo: "01:42 — 01:47:48"
},

{
nombre: "Virgen de los Dolores",
imagen: "https://www.mundocofrade.es/asset/thumbnail,992,744,center,center/media/mundocofrade/images/2026/06/19/2026061909223555444.jpg",
inicio: 8534,
fin: 8818,
tiempo: "02:22:14 — 02:26:58"
}

];


let indiceActual = 0;

let pregonPlayer = null;

let musicaPlayer = null;

let temporizador = null;

let musicaActiva = false;

let pregonIniciado = false;


/* ==========================
   MOSTRAR FRAGMENTO
========================== */

function mostrarFragmento(indice) {

indiceActual = indice;

const f = fragmentos[indice];

document.getElementById("imagenSala").src =
f.imagen;

document.getElementById("numeroFragmento").textContent =
"FRAGMENTO " + numeroRomano(indice + 1);

document.getElementById("nombreHermandad").textContent =
f.nombre;

document.getElementById("tiempoFragmento").textContent =
f.tiempo;

crearPuntos();

}


/* ==========================
   ROMANOS
========================== */

function numeroRomano(numero) {

return ["I","II","III","IV","V","VI"][numero - 1];

}


/* ==========================
   PUNTOS
========================== */

function crearPuntos() {

const contenedor =
document.getElementById("puntos");

contenedor.innerHTML = "";

fragmentos.forEach(function(f, i) {

const punto =
document.createElement("span");

punto.className = "punto";

if (i === indiceActual) {

punto.classList.add("activo");

}

punto.onclick = function() {

detenerPregon();

mostrarFragmento(i);

};

contenedor.appendChild(punto);

});

}


/* ==========================
   SIGUIENTE
========================== */

function siguiente() {

detenerPregon();

let nuevo =
indiceActual + 1;

if (nuevo >= fragmentos.length) {

nuevo = 0;

}

mostrarFragmento(nuevo);

}


/* ==========================
   ANTERIOR
========================== */

function anterior() {

detenerPregon();

let nuevo =
indiceActual - 1;

if (nuevo < 0) {

nuevo = fragmentos.length - 1;

}

mostrarFragmento(nuevo);

}


/* ==========================
   ESCUCHAR
========================== */

function escucharFragmento() {


if (!pregonPlayer) {

alert(
"Espera unos segundos a que cargue el reproductor."
);

return;

}


const f =
fragmentos[indiceActual];


detenerPregon();


/*
   CARGAMOS DIRECTAMENTE EL FRAGMENTO.
*/

pregonPlayer.loadVideoById({

videoId: VIDEO_PREGON,

startSeconds: f.inicio,

endSeconds: f.fin

});


/*
   VOLUMEN DE LA VOZ.
*/

pregonPlayer.setVolume(100);


/*
   REPRODUCIMOS.
*/

pregonPlayer.playVideo();


pregonIniciado = true;


/*
   CAMBIAMOS EL TEXTO DEL BOTÓN.
*/

document.getElementById("botonFragmento").textContent =
"Ⅱ Escuchando fragmento";


/*
   CONTROLAMOS EL FINAL.
*/

temporizador = setInterval(function() {


if (!pregonPlayer) {

return;

}


const posicion =
pregonPlayer.getCurrentTime();


if (posicion >= f.fin) {


detenerPregon();


/*
   PASAMOS AUTOMÁTICAMENTE
   AL SIGUIENTE FRAGMENTO.
*/

setTimeout(function() {

siguiente();

}, 700);

}


}, 200);

}


/* ==========================
   DETENER
========================== */

function detenerPregon() {


if (temporizador) {

clearInterval(temporizador);

temporizador = null;

}


if (pregonPlayer) {

try {

pregonPlayer.stopVideo();

} catch(e) {}

}


document.getElementById("botonFragmento").textContent =
"▶ Escuchar fragmento";

}


/* ==========================
   MÚSICA
========================== */

function iniciarMusica() {


if (!musicaPlayer) {

return;

}


musicaPlayer.setVolume(10);

musicaPlayer.playVideo();

musicaActiva = true;

document.getElementById("botonMusica").textContent =
"Ⅱ";

}


/* ==========================
   BOTÓN MÚSICA
========================== */

function activarMusica() {


if (!musicaPlayer) {

return;

}


if (musicaActiva) {


musicaPlayer.pauseVideo();

musicaActiva = false;

document.getElementById("botonMusica").textContent =
"♪";


} else {


musicaPlayer.setVolume(10);

musicaPlayer.playVideo();

musicaActiva = true;

document.getElementById("botonMusica").textContent =
"Ⅱ";

}

}


/* ==========================
   YOUTUBE
========================== */

function onYouTubeIframeAPIReady() {


pregonPlayer =
new YT.Player("pregonPlayer", {

width: "2",

height: "2",

videoId: VIDEO_PREGON,

playerVars: {

controls: 0,

rel: 0,

playsinline: 1,

disablekb: 1

},

events: {

onReady: function(event) {

event.target.setVolume(100);

}

}

});


musicaPlayer =
new YT.Player("musicaPlayer", {

width: "2",

height: "2",

videoId: VIDEO_MARCHA,

playerVars: {

controls: 0,

rel: 0,

playsinline: 1,

disablekb: 1

},

events: {

onReady: function(event) {

event.target.setVolume(10);

}

}

});

}


/* ==========================
   INICIO
========================== */

mostrarFragmento(0);

</script>


<script src="https://www.youtube.com/iframe_api"></script>


</body>

</html>
