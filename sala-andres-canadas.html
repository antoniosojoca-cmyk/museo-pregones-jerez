

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sala III — Andrés Cañadas</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080808;
      color: #f5f0e6;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    .sala {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.55);
    }

    .velo {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.4) 45%,
        rgba(0,0,0,0.88)
      );
    }

    .contenido {
      position: absolute;
      left: 50%;
      bottom: 13%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1000px;
      text-align: center;
      text-shadow: 0 3px 12px #000;
    }

    .sala-numero {
      color: #c9a24d;
      font-size: 18px;
      letter-spacing: 5px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 5vw, 58px);
      color: #d4af55;
      font-weight: normal;
    }

    h2 {
      margin: 0 0 25px;
      font-size: clamp(20px, 3vw, 34px);
      font-weight: normal;
    }

    .escuchar {
      border: 1px solid #c9a24d;
      background: rgba(0,0,0,0.7);
      color: #e2c46b;
      padding: 12px 25px;
      border-radius: 4px;
      cursor: pointer;
      font-family: Georgia, serif;
      font-size: 16px;
    }

    .escuchar:hover {
      background: #c9a24d;
      color: #080808;
    }

    .flecha {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 70px;
      border: none;
      background: rgba(0,0,0,0.25);
      color: #d4af55;
      font-size: 45px;
      cursor: pointer;
      z-index: 10;
    }

    .flecha:hover {
      background: rgba(0,0,0,0.65);
    }

    .izquierda { left: 15px; }
    .derecha { right: 15px; }

    .puntos {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .punto {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid #d4af55;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .punto.active { background: #d4af55; }

    .volver {
      position: absolute;
      top: 25px;
      left: 25px;
      z-index: 20;
      color: #d4af55;
      text-decoration: none;
      border: 1px solid rgba(212,175,85,0.7);
      background: rgba(0,0,0,0.65);
      padding: 9px 16px;
      border-radius: 4px;
      font-size: 14px;
    }

    .volver:hover {
      background: #d4af55;
      color: #080808;
    }

    .musica {
      position: absolute;
      top: 25px;
      right: 25px;
      z-index: 20;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid #c9a24d;
      background: rgba(0,0,0,0.7);
      color: #d4af55;
      cursor: pointer;
      font-size: 18px;
    }

    .youtube {
      position: absolute;
      width: 1px;
      height: 1px;
      left: -10px;
      top: -10px;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .contenido { bottom: 15%; }
      .flecha { width: 38px; font-size: 32px; }
      .volver { top: 15px; left: 15px; }
      .musica { top: 15px; right: 15px; }
    }
  </style>
</head>

<body>
  <div class="sala">

    <div class="slide active">
      <img src="https://static.grupojoly.com/clip/7be05118-450c-46f9-a132-4168fc6c7bf6_source-aspect-ratio_1600w_0.webp" alt="Semana Santa de Jerez">
      <div class="velo"></div>
      <div class="contenido">
        <div class="sala-numero">SALA III</div>
        <h1>Andrés Cañadas</h1>
        <h2>Semana Santa de Jerez</h2>
        <button class="escuchar" onclick="escucharFragmento(0)">▶ Escuchar fragmento</button>
      </div>
    </div>

    <div class="slide">
      <img src="https://static.grupojoly.com/clip/b3ddbe53-7892-431d-834f-213cb26feb1b_16-9-aspect-ratio_1200w_1011885.webp" alt="Entrega">
      <div class="velo"></div>
      <div class="contenido">
        <div class="sala-numero">SALA III</div>
        <h1>Andrés Cañadas</h1>
        <h2>Entrega</h2>
        <button class="escuchar" onclick="escucharFragmento(1)">▶ Escuchar fragmento</button>
      </div>
    </div>

    <div class="slide">
      <img src="https://hermandaddeltransporte.com/wp-content/uploads/2022/11/img_20201101_105436_576.jpg" alt="Domingo de Ramos">
      <div class="velo"></div>
      <div class="contenido">
        <div class="sala-numero">SALA III</div>
        <h1>Andrés Cañadas</h1>
        <h2>Domingo de Ramos</h2>
        <button class="escuchar" onclick="escucharFragmento(2)">▶ Escuchar fragmento</button>
      </div>
    </div>

    <div class="slide">
      <img src="https://www.uniondehermandades.com/wp-content/uploads/2018/11/1-21.jpg" alt="Martes Santo">
      <div class="velo"></div>
      <div class="contenido">
        <div class="sala-numero">SALA III</div>
        <h1>Andrés Cañadas</h1>
        <h2>Martes Santo</h2>
        <button class="escuchar" onclick="escucharFragmento(3)">▶ Escuchar fragmento</button>
      </div>
    </div>

    <div class="slide">
      <img src="https://www.uniondehermandades.com/wp-content/uploads/2018/11/1-24.jpg"  alt="Miércoles Santo">
      <div class="velo"></div>
      <div class="contenido">
        <div class="sala-numero">SALA III</div>
        <h1>Andrés Cañadas</h1>
        <h2>Miércoles Santo</h2>
        <button class="escuchar" onclick="escucharFragmento(4)">▶ Escuchar fragmento</button>
      </div>
    </div>

    <div class="slide">
      <img src="https://www.veracruzjerez.es/wp-content/uploads/2025/11/Foto-Cristo-de-la-Esperanza-06-11-25-3-980x735.jpg">
      <div class="velo"></div>
      <div class="contenido">
        <div class="sala-numero">SALA III</div>
        <h1>Andrés Cañadas</h1>
        <h2>Jueves Santo</h2>
        <button class="escuchar" onclick="escucharFragmento(5)">▶ Escuchar fragmento</button>
      </div>
    </div>

    <button class="flecha izquierda" onclick="cambiarSlide(-1)" aria-label="Imagen anterior">‹</button>
    <button class="flecha derecha" onclick="cambiarSlide(1)" aria-label="Imagen siguiente">›</button>

    <div class="puntos">
      <button class="punto active" onclick="irSlide(0)" aria-label="Fragmento 1"></button>
      <button class="punto" onclick="irSlide(1)" aria-label="Fragmento 2"></button>
      <button class="punto" onclick="irSlide(2)" aria-label="Fragmento 3"></button>
      <button class="punto" onclick="irSlide(3)" aria-label="Fragmento 4"></button>
      <button class="punto" onclick="irSlide(4)" aria-label="Fragmento 5"></button>
      <button class="punto" onclick="irSlide(5)" aria-label="Fragmento 6"></button>
    </div>

    <a href="index.html" class="volver">← Volver al museo</a>
    <button class="musica" onclick="toggleMusica()" title="Activar o pausar música">♪</button>

    <div class="youtube">
      <div id="player"></div>
      <div id="musicPlayer"></div>
    </div>

  </div>

  <script>
    const fragmentos = [
      { inicio: 1364, fin: 1427 },
      { inicio: 1770, fin: 1835 },
      { inicio: 2451, fin: 2534 },
      { inicio: 3478, fin: 3530 },
      { inicio: 4068, fin: 4153 },
      { inicio: 4648, fin: 4700 }
    ];

    const slides = document.querySelectorAll(".slide");
    const puntos = document.querySelectorAll(".punto");

    let actual = 0;
    let player = null;
    let musicPlayer = null;
    let intervalo = null;
    let musicaActiva = false;
    let apiCargada = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("player", {
        height: "1",
        width: "1",
        videoId: "zbobklPPeNA",
        playerVars: {
          autoplay: 0,
          controls: 0,
          rel: 0
        }
      });

      musicPlayer = new YT.Player("musicPlayer", {
        height: "1",
        width: "1",
        videoId: "AK8Te1T8WD8",
        playerVars: {
          autoplay: 0,
          controls: 0,
          rel: 0
        },
        events: {
          onReady: function(event) {
            event.target.setVolume(8);
          }
        }
      });

      apiCargada = true;
    }

    function escucharFragmento(indice) {
      if (!apiCargada || !player) {
        alert("Espera unos segundos a que cargue el reproductor y vuelve a pulsar.");
        return;
      }

      clearInterval(intervalo);

      actual = indice;
      mostrarSlide(actual);

      const fragmento = fragmentos[indice];

      player.loadVideoById({
        videoId: "zbobklPPeNA",
        startSeconds: fragmento.inicio
      });

      intervalo = setInterval(function() {
        if (!player || typeof player.getCurrentTime !== "function") return;

        const tiempo = player.getCurrentTime();

        if (tiempo >= fragmento.fin) {
          clearInterval(intervalo);
          intervalo = null;
          player.pauseVideo();

          // AL TERMINAR EL FRAGMENTO, AVANZA AUTOMÁTICAMENTE
          cambiarSlide(1);
        }
      }, 250);
    }

    function mostrarSlide(numero) {
      slides.forEach(function(slide, i) {
        slide.classList.toggle("active", i === numero);
      });

      puntos.forEach(function(punto, i) {
        punto.classList.toggle("active", i === numero);
      });

      actual = numero;
    }

    function cambiarSlide(direccion) {
      clearInterval(intervalo);
      intervalo = null;

      if (player && typeof player.pauseVideo === "function") {
        player.pauseVideo();
      }

      actual = (actual + direccion + slides.length) % slides.length;
      mostrarSlide(actual);
    }

    function irSlide(numero) {
      clearInterval(intervalo);
      intervalo = null;

      if (player && typeof player.pauseVideo === "function") {
        player.pauseVideo();
      }

      mostrarSlide(numero);
    }

    function toggleMusica() {
      if (!musicPlayer) return;

      if (!musicaActiva) {
        musicPlayer.playVideo();
        musicaActiva = true;
      } else {
        musicPlayer.pauseVideo();
        musicaActiva = false;
      }
    }
  </script>

  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
